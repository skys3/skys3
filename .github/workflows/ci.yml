name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether this change needs the build and test jobs. When every
  # changed file is documentation (scripts/ci/docs-only.sh), they are
  # skipped and the `docs` job runs instead. The protocol model check runs
  # only when something under spec/ changed. Manual dispatches, and pushes
  # whose previous tip cannot be fetched, run everything.
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
      spec: ${{ steps.classify.outputs.spec }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as its merge commit, whose first
          # parent is the tip of the base branch.
          fetch-depth: 2

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) if git fetch -q --depth=1 origin "$BEFORE"; then base=$BEFORE; fi ;;
          esac
          if [ -n "$base" ] && sh scripts/ci/docs-only.sh "$base" HEAD; then
            echo "Only documentation changed; skipping the build and test jobs."
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -q '^spec/'; then
            echo spec=true >> "$GITHUB_OUTPUT"
          else
            echo "spec/ is unchanged; skipping the protocol model check."
            echo spec=false >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Format, lint, test, docs (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run doctests
        run: cargo test --doc --all-features

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Runs instead of the build and test jobs when only documentation
  # changed. The README is the crate's rustdoc (src/lib.rs includes it),
  # so its doctests and links are still checked, and on main so are its
  # badges.
  docs:
    name: Doctests and docs
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run doctests
        run: cargo test --doc --all-features

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # A docs-only push to main publishes no badges but may have changed
      # the README that embeds them, so check that it still renders the
      # badges already published for main.
      - name: Verify the README badges render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/verify-badges-render.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

  # Line coverage gate. The threshold lives in the `coverage` alias in
  # .cargo/config.toml. Reports are uploaded even when the gate fails. The
  # job has read-only access; badge publication is a separate job. Runs on
  # x86_64 only, so the coverage badge has one figure.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.report.outputs.complete }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add --toolchain stable llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Check coverage threshold
        run: |
          set -o pipefail
          mkdir -p target/coverage
          cargo coverage --json --summary-only --output-path target/coverage/coverage.json 2>&1 \
            | tee target/coverage/coverage.log

      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: error

      # Tells publish-badges whether there are figures to publish: a
      # coverage report from a run whose tests all passed. That holds when
      # only the threshold was missed, but not when the tests failed.
      - name: Check for a complete coverage report
        id: report
        if: always()
        run: |
          if [ -s target/coverage/coverage.json ] &&
            ! grep -q '^test result: FAILED' target/coverage/coverage.log; then
            echo complete=true >> "$GITHUB_OUTPUT"
          fi

  # Publishes the coverage and test-count badges for the pushed branch to
  # the `badges` branch (path `<branch>/`) as SVG files; the README embeds
  # `main/` through github.com, so the badges also render in a private
  # repository and need no external service. A separate job so that only
  # this step, which runs no project code, holds a write-capable token.
  # Runs on pushes to main and on manual dispatch (any branch, so the
  # mechanism can be exercised before merge). scripts/ci/publish-badges.sh
  # skips figures for a commit that is no longer its branch's tip. Also
  # runs when the coverage job failed only on its threshold, so the badge
  # shows the below-threshold figure instead of the last passing one. A
  # docs-only change skips coverage and publishes nothing; the script
  # keeps publishing for a commit that only such changes followed.
  publish-badges:
    name: Publish badges
    if: >-
      !cancelled() && needs.coverage.outputs.report == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: badges-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: target/coverage

      - name: Publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: sh scripts/ci/publish-badges.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" target/coverage/coverage.json target/coverage/coverage.log

      # Fetches the README as GitHub renders it and checks that it embeds
      # the tests and coverage badges once each and that GitHub serves the
      # files just published as SVG images.
      - name: Verify the README badges render
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/verify-badges-render.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the `rust-version` toolchain from Cargo.toml
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - name: Check
        run: cargo check --all-targets --all-features

  # License allowlist, RustSec advisories, duplicate-version bans, and
  # allowed sources, as configured in deny.toml.
  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check licenses, advisories, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Deterministic simulation scenarios over a fixed seed set, larger than
  # the few seeds the `rust` job's tests run. Scenario tests live in each
  # crate's `simulation` test target (crates/skys3-sim/src/lib.rs). Each test
  # runs in a process of its own (scripts/ci/simulation.sh), so that other
  # tests' Tokio tasks cannot change a seed's run, and a failure prints the
  # seed and the command that replays it.
  simulation:
    name: Simulation with a fixed seed set
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run simulation scenarios
        run: sh scripts/ci/simulation.sh
        env:
          SKYS3_SIM_SEEDS: 256

  # The etcd control-store backend against a real etcd (plan M2-05): the
  # conformance suite (M2-06), which includes the startup probe, and paged
  # listings, endpoint failover, and watches. The etcd tests skip
  # themselves when SKYS3_ETCD_ENDPOINTS is unset, as in the other jobs.
  # The image runs as root in /var/lib/etcd; it has no shell for a
  # container health check, so the job waits on /health itself.
  etcd:
    name: etcd integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.6.10
        ports:
          - 2379:2379
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the etcd tests
        run: cargo test -p skys3-control --all-features --test etcd --test conformance --no-run

      - name: Wait for etcd
        run: |
          for _ in $(seq 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:2379/health; then exit 0; fi
            sleep 1
          done
          echo "etcd did not become healthy" >&2
          exit 1

      - name: Run the etcd tests
        run: |
          cargo test -p skys3-control --all-features --test etcd -- --nocapture
          cargo test -p skys3-control --all-features --test conformance the_etcd_store_conforms -- --nocapture
        env:
          SKYS3_ETCD_ENDPOINTS: http://127.0.0.1:2379

  # A brief cargo-fuzz run of every target in fuzz/, found with `cargo fuzz
  # list` so new targets join automatically, from its committed corpus and
  # under its bounds (fuzz/run.sh). Long runs are nightly
  # (fuzz-nightly.yml). A crash fails the job and uploads the input that
  # caused it.
  fuzz:
    name: Fuzz smoke runs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      FUZZ_SECONDS: 30
      # The prebuilt cargo-fuzz is a musl binary and defaults `--target`
      # to its own triple, which has no sanitizer support; name the host.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache the fuzz build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Build every target
        run: cargo +nightly fuzz build --target "$FUZZ_TARGET"

      - name: Run every target
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            fuzz/run.sh "$target" "$FUZZ_SECONDS"
            echo "::endgroup::"
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The SDK matrix (plan M1-25, design section 16.2): the binary serving
  # HTTPS and STS against the AWS SDKs for Python, Go, JavaScript, Java,
  # and Rust, the AWS CLI, and the ceph/s3-tests subset, all at once
  # (crates/skys3/tests/sdk.rs). Each client but Rust runs in its own
  # image with pinned versions (tests/sdk/run.sh), built while the test
  # compiles.
  sdk:
    name: SDK matrix
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the test and the client images
        run: |
          sh tests/sdk/run.sh build &
          images=$!
          cargo test -p skys3 --test sdk --no-run
          wait "$images"

      - name: Run the matrix
        run: cargo test -p skys3 --test sdk -- --nocapture
        env:
          SKYS3_SDK_CLIENTS: python go javascript java cli s3-tests

  # The end-to-end suite (plan M8-01, design sections 16.2 and 17): the
  # node binary, built once with the `e2e` profile, against MinIO, a static
  # OIDC issuer, and the runner's AWS CLI, and two clusters peered over QUIC
  # and S3 REST (tests/e2e/run.sh). MinIO no longer publishes binaries, so
  # tests/e2e/minio.sh builds it from source while the node compiles, once
  # per version: the cache keeps it. The suite's CA goes into the system
  # trust store, which the node's OIDC fetcher reads, and the peering
  # scenario drops UDP with iptables through sudo. Beside the full suite
  # over the file control store, the single-node scenarios run again over
  # etcd with mutual TLS (the pinned release tests/e2e/etcd.sh downloads)
  # and over an S3 control bucket of a second SkyS3 cluster (plan M8-03;
  # MinIO fails the startup probe, which the suite checks), each on ports
  # and in a directory of its own (tests/e2e/control-stores.sh); they
  # finish within the peering scenario's five minutes. The etcd leg also
  # runs the three-node cluster scenario (plan M8-04: registration,
  # heartbeats, refused strangers, and a handshake flood), about a minute
  # beside its single-node scenarios, and the replication and coordinator
  # scenarios (plans M8-05b and M8-06), beside them too. When the suite
  # fails, its directories (logs, configurations, and data directories)
  # are uploaded. The job also checks the alerting rules and runs their unit
  # tests with promtool from a pinned Prometheus release, which takes
  # seconds (scripts/ci/promtool.sh).
  e2e:
    name: End-to-end suite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Saved even when the suite fails, so the next run builds only the
      # workspace.
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e
          cache-on-failure: true

      - name: Check the alerting rules
        run: sh scripts/ci/promtool.sh

      - name: Find the MinIO version
        id: minio
        run: echo "version=$(sed -n 's/^MINIO_VERSION=//p' tests/e2e/minio.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore MinIO
        id: minio-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/skys3-e2e
          key: e2e-minio-${{ steps.minio.outputs.version }}

      - name: Build the node binary and MinIO
        run: |
          bash tests/e2e/minio.sh >"$RUNNER_TEMP/minio-path" &
          minio=$!
          cargo build --profile e2e -p skys3
          wait "$minio"
          echo "SKYS3_E2E_MINIO=$(cat "$RUNNER_TEMP/minio-path")" >> "$GITHUB_ENV"

      - name: Save MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/skys3-e2e
          key: e2e-minio-${{ steps.minio.outputs.version }}

      - name: Make the PKI and trust its CA
        run: |
          bash tests/e2e/pki.sh "$RUNNER_TEMP/pki"
          sudo cp "$RUNNER_TEMP/pki/e2e-ca.pem" /usr/local/share/ca-certificates/skys3-e2e.crt
          sudo update-ca-certificates
          aws --version

      - name: Download etcd
        run: echo "SKYS3_E2E_ETCD=$(bash tests/e2e/etcd.sh)" >> "$GITHUB_ENV"
        env:
          SKYS3_E2E_CACHE: ${{ runner.temp }}/etcd

      - name: Run the suite
        run: tests/e2e/control-stores.sh
        env:
          SKYS3_E2E_BINARY: target/e2e/skys3
          SKYS3_E2E_PKI: ${{ runner.temp }}/pki
          SKYS3_E2E_SYSTEM_TRUST: 1

      - name: Upload the suite's directories
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-run
          path: target/e2e-run*/
          if-no-files-found: ignore
          retention-days: 7

  # Model-checks the shard protocol (spec/ShardProtocol.tla) with TLC at the
  # PR bounds, and checks that every seeded bug is still caught, so the
  # model cannot silently lose its teeth. spec/check.sh downloads the pinned
  # tla2tools.jar and verifies its checksum. The nightly workflow runs the
  # same checks at larger bounds.
  model:
    name: Protocol model check
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show the Java runtime
        run: java -version

      - name: Check the model and the seeded bugs
        run: spec/check.sh all pr

  # The one check to require in branch protection. A job skipped for a
  # docs-only change satisfies a required check, except a matrix job: it
  # reports under its unexpanded name, so a required `Format, lint, test,
  # docs (x86_64)` would never arrive. This job passes when every job it
  # needs passed or was skipped.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, rust, docs, coverage, msrv, deny, simulation, etcd, fuzz, sdk, e2e, model]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
