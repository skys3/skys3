name: Nightly

# Long-running checks that are too slow for every pull request (plan
# section 5). Each job runs on a schedule and can be started by hand; by
# hand, `suite: chaos` runs the kill, partition, and peering suite alone.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Which jobs to run
        type: choice
        options: [all, chaos]
        default: all
      chaos_seed:
        description: The kill, partition, and peering suite's seed (empty for a random one)
        type: string
        default: ""
      chaos_minutes:
        description: How long the kill, partition, and peering suite strikes faults
        type: string
        default: "40"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The protocol model (spec/ShardProtocol.tla) at the nightly bounds, then
  # every seeded bug. spec/README.md lists the models, their state counts,
  # and their run times (about an hour on four cores).
  model:
    name: Protocol model check (nightly bounds)
    if: inputs.suite != 'chaos'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Show the Java runtime
        run: java -version

      - name: Check the model and the seeded bugs
        run: spec/check.sh all nightly
        env:
          TLC_JAVA_OPTS: -Xmx10g

  # Every simulation target (crates/skys3-sim/src/lib.rs) with seeds that
  # change every night and longer runs (SKYS3_SIM_SCALE), in release mode
  # with debug assertions and overflow checks kept, each test in a process
  # of its own (scripts/ci/simulation.sh). A failing seed prints
  # the command that replays it; it then becomes a regression test that
  # runs that seed with `Runner::with_seeds` (plan section 5).
  simulation:
    name: Simulation with random seeds and long runs
    if: inputs.suite != 'chaos'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Draw the first seed
        run: |
          first="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          echo "First seed: $first"
          echo "SKYS3_SIM_FIRST_SEED=$first" >> "$GITHUB_ENV"

      - name: Run simulation scenarios
        run: sh scripts/ci/simulation.sh --release
        env:
          SKYS3_SIM_SEEDS: 1024
          SKYS3_SIM_SCALE: 4

  # `kill -9` loops against the real binary on a real file system
  # (crates/skys3/tests/kill.rs): many more kills than the few every pull
  # request runs, with a seed for the clients' choices that changes every
  # night. A failure prints the seed and the end of the node's log.
  kill-loops:
    name: Kill loops against the binary
    if: inputs.suite != 'chaos'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Draw the seed
        run: |
          seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          echo "Seed: $seed"
          echo "SKYS3_KILL_SEED=$seed" >> "$GITHUB_ENV"

      - name: Run the kill loops
        run: cargo test --release -p skys3 --test kill -- --nocapture
        env:
          SKYS3_KILL_ROUNDS: 200

  # The control-store conformance suite (plan M2-06) against real S3
  # providers: an S3 control store in a bucket of each, under a fresh
  # prefix per run, which the test empties afterwards. A provider runs only
  # when its repository secrets are set; without them its job says so and
  # passes. For provider P (AWS or R2) they are CONTROL_STORE_P_ENDPOINT
  # (such as https://s3.us-east-1.amazonaws.com or
  # https://<account>.r2.cloudflarestorage.com), CONTROL_STORE_P_BUCKET,
  # CONTROL_STORE_P_ACCESS_KEY_ID, CONTROL_STORE_P_SECRET_ACCESS_KEY, and
  # optionally CONTROL_STORE_P_REGION. The credential needs only the
  # control-store policy of design section 6.1 on `skys3-conformance/*`; a
  # lifecycle rule that expires that prefix removes what a cancelled run
  # leaves behind.
  control-store:
    name: Control-store conformance (${{ matrix.provider }})
    if: inputs.suite != 'chaos'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: AWS S3
            secrets: AWS
            region: us-east-1
          - provider: R2
            secrets: R2
            region: auto
    env:
      SKYS3_CONTROL_S3_ENDPOINT: ${{ secrets[format('CONTROL_STORE_{0}_ENDPOINT', matrix.secrets)] }}
      SKYS3_CONTROL_S3_BUCKET: ${{ secrets[format('CONTROL_STORE_{0}_BUCKET', matrix.secrets)] }}
      SKYS3_CONTROL_S3_REGION: ${{ secrets[format('CONTROL_STORE_{0}_REGION', matrix.secrets)] || matrix.region }}
      AWS_ACCESS_KEY_ID: ${{ secrets[format('CONTROL_STORE_{0}_ACCESS_KEY_ID', matrix.secrets)] }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets[format('CONTROL_STORE_{0}_SECRET_ACCESS_KEY', matrix.secrets)] }}
    steps:
      - name: Check for the provider's secrets
        id: secrets
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          if [ -n "$SKYS3_CONTROL_S3_ENDPOINT" ] && [ -n "$SKYS3_CONTROL_S3_BUCKET" ] &&
            [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo configured=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping $PROVIDER: its CONTROL_STORE_* secrets are not set."
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.configured == 'true'

      - name: Install stable Rust
        if: steps.secrets.outputs.configured == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run the conformance suite
        if: steps.secrets.outputs.configured == 'true'
        run: cargo test -p skys3-control --all-features --test conformance an_s3_provider_conforms -- --nocapture

  # The kill, partition, and peering suite (plan M8-08, tests/e2e/chaos):
  # the node binary as a 5-node cluster over a 3-member etcd, with a 3-node
  # cluster it peers with, each process in a network namespace of its own,
  # under a seeded schedule of kills, kill loops, iptables partitions of
  # primaries, tc netem delay and loss, rack loss, the coordinator's loss in
  # the middle of a join and of a handoff, and an etcd member's loss, while
  # a client workload records every acknowledged write. It fails if a key
  # does not read back with its acknowledged content, a read after an
  # acknowledgment returns older content, the cluster does not heal with no
  # operator action, replicas do not converge, or the peered keys do not
  # arrive. The seed is printed and in the report, whose failover-time
  # percentiles go to the job summary and an artifact; a failing night
  # replays with SKYS3_CHAOS_SEED (runbook "Replaying a night of the kill,
  # partition, and peering suite"). Started by hand, `suite: chaos` runs
  # this job alone, with a chosen seed and length. The M8 exit asks for 7
  # clean scheduled nights in a row, which the last step counts from the
  # workflow's history into the summary (tests/e2e/chaos/nights.sh).
  chaos:
    name: Kill, partition, and peering suite
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Build the node binary
        run: cargo build --profile e2e -p skys3

      - name: Download etcd
        run: echo "SKYS3_E2E_ETCD=$(bash tests/e2e/etcd.sh)" >> "$GITHUB_ENV"
        env:
          SKYS3_E2E_CACHE: ${{ runner.temp }}/etcd

      # The runner's kernel has the netem qdisc as a module, which some
      # images keep in the extra modules package.
      - name: Load tc netem
        run: |
          if ! sudo modprobe sch_netem; then
            sudo apt-get update -q
            sudo apt-get install -yq "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          fi

      - name: Draw the seed
        env:
          SEED: ${{ inputs.chaos_seed }}
        run: |
          seed="${SEED:-$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')}"
          echo "Seed: $seed"
          echo "SKYS3_CHAOS_SEED=$seed" >> "$GITHUB_ENV"

      - name: Run the suite
        run: |
          sudo --preserve-env=GITHUB_STEP_SUMMARY,SKYS3_CHAOS_SEED,SKYS3_CHAOS_MINUTES,SKYS3_CHAOS_NETEM,SKYS3_E2E_BINARY,SKYS3_E2E_ETCD \
            env "PATH=$PATH" tests/e2e/chaos/run.sh
        env:
          SKYS3_CHAOS_MINUTES: ${{ inputs.chaos_minutes || '40' }}
          SKYS3_CHAOS_NETEM: require
          SKYS3_E2E_BINARY: target/e2e/skys3

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-report
          path: |
            target/chaos-run/report.json
            target/chaos-run/report.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the run's directory
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-run
          path: target/chaos-run/
          if-no-files-found: ignore
          retention-days: 7

      - name: Count the clean nights
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/e2e/chaos/nights.sh "$GITHUB_REPOSITORY" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
