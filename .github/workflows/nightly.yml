name: Nightly

# Long-running checks that are too slow for every pull request (plan
# section 5). Each job runs on a schedule and can be started by hand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The protocol model (spec/ShardProtocol.tla) at the nightly bounds, then
  # every seeded bug. spec/README.md lists the models, their state counts,
  # and their run times (about an hour on four cores).
  model:
    name: Protocol model check (nightly bounds)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Show the Java runtime
        run: java -version

      - name: Check the model and the seeded bugs
        run: spec/check.sh all nightly
        env:
          TLC_JAVA_OPTS: -Xmx10g

  # Every simulation target (crates/skys3-sim/src/lib.rs) with seeds that
  # change every night and longer runs (SKYS3_SIM_SCALE), in release mode
  # with debug assertions and overflow checks kept. A failing seed prints
  # the command that replays it; it then becomes a regression test that
  # runs that seed with `Runner::with_seeds` (plan section 5).
  simulation:
    name: Simulation with random seeds and long runs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Draw the first seed
        run: |
          first="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          echo "First seed: $first"
          echo "SKYS3_SIM_FIRST_SEED=$first" >> "$GITHUB_ENV"

      - name: Run simulation scenarios
        run: cargo test --release --workspace --all-features --test simulation
        env:
          SKYS3_SIM_SEEDS: 1024
          SKYS3_SIM_SCALE: 4
