name: Nightly

# Long-running checks that are too slow for every pull request (plan
# section 5). Each job runs on a schedule and can be started by hand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The protocol model (spec/ShardProtocol.tla) at the nightly bounds, then
  # every seeded bug. spec/README.md lists the models, their state counts,
  # and their run times (about an hour on four cores).
  model:
    name: Protocol model check (nightly bounds)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Show the Java runtime
        run: java -version

      - name: Check the model and the seeded bugs
        run: spec/check.sh all nightly
        env:
          TLC_JAVA_OPTS: -Xmx10g
