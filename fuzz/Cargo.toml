# cargo-fuzz targets for SkyS3's parsers of untrusted input (plan rule 1.1).
# Run with `cargo +nightly fuzz run <target>` from the repository root.
#
# This crate is outside the main workspace: it needs a nightly toolchain and
# libFuzzer. Every target still has `#![forbid(unsafe_code)]`: the
# `#[no_mangle]` export that `fuzz_target!` generates comes from an external
# macro, which the `unsafe_code` lint does not report.

[package]
name = "skys3-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
crc32c = "0.6"
libfuzzer-sys = "0.4"
serde_json = "1"
skys3-control = { path = "../crates/skys3-control" }
skys3-coord = { path = "../crates/skys3-coord" }
skys3-gateway = { path = "../crates/skys3-gateway", features = ["test-util"] }
skys3-index = { path = "../crates/skys3-index" }
skys3-log = { path = "../crates/skys3-log" }
skys3-net = { path = "../crates/skys3-net" }
skys3-obs = { path = "../crates/skys3-obs" }
skys3-shard = { path = "../crates/skys3-shard" }
skys3-sts = { path = "../crates/skys3-sts" }
skys3-types = { path = "../crates/skys3-types" }
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "control_etcd_frame"
path = "fuzz_targets/control_etcd_frame.rs"
test = false
doc = false
bench = false

