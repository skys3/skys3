[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license-file = "LICENSE"
repository = "https://github.com/skys3/skys3"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.12.0", default-features = false, features = ["credentials-process", "rt-tokio"] }
aws-lc-rs = { version = "1.18.1", default-features = false }
aws-runtime = "1.10.0"
aws-sdk-s3 = { version = "1.151.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5.0", default-features = false, features = ["rustls-aws-lc"] }
base64 = "0.23.1"
bytes = "1.12.1"
crc32c = "0.6.8"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
prometheus-client = "0.25.1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
quick-xml = { version = "0.42.0", default-features = false }
rand = "0.9.5"
redb = { version = "4.3.0", default-features = false, features = ["std"] }
rustls = { version = "0.23.45", default-features = false }
rustls-native-certs = "0.8.4"
s3s = { version = "0.17.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = { version = "0.11.0", default-features = false }
skys3-config = { path = "crates/skys3-config" }
skys3-control = { path = "crates/skys3-control" }
skys3-index = { path = "crates/skys3-index" }
skys3-io = { path = "crates/skys3-io" }
skys3-log = { path = "crates/skys3-log" }
skys3-remote = { path = "crates/skys3-remote" }
skys3-shard = { path = "crates/skys3-shard" }
skys3-sim = { path = "crates/skys3-sim" }
skys3-types = { path = "crates/skys3-types" }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false }
turmoil = "0.7.2"
