# cargo-deny configuration: license allowlist, RustSec advisories, and
# duplicate-version bans. CI runs `cargo deny check` on every change that
# is not docs-only. See docs/skys3-tasks-plan.md, M0-01.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including unmaintained and
# unsound crates. An exception goes in `ignore` with the advisory ID and a
# reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Add a license here only after checking that it
# is compatible with FSL-1.1-ALv2 distribution of the SkyS3 binary.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allowlist is policy, not an inventory of the current tree.
unused-allowed-license = "allow"

[licenses.private]
# The workspace crates are unpublished and licensed by LICENSE (FSL-1.1-ALv2).
ignore = true

[bans]
# Two versions of one crate in the build fail the check. A duplicate that
# cannot be avoided yet goes in `skip` with the reason and the crates that
# pull in each version.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    # The ecosystem is moving proc macros from syn 2 to syn 3. turmoil's
    # tracing (#[instrument], tracing-attributes) and rand's zerocopy-derive
    # are still on syn 2, while serde, thiserror, tokio-macros and
    # prometheus-client's derive are on syn 3. Both are build-time only.
    # Remove once tracing-attributes and zerocopy-derive move to syn 3.
    { crate = "syn@2", reason = "proc-macro dependencies are split between syn 2 and syn 3; build-time only" },
    # aws-lc-sys (the crypto behind rustls and skys3-sts) builds with cc,
    # whose jobserver uses getrandom 0.4 on Windows only; getrandom 0.4 uses
    # r-efi 6 on UEFI only. rand 0.9 uses getrandom 0.3 and r-efi 5. Neither
    # duplicate is compiled on the platforms SkyS3 targets. Remove once rand
    # moves to getrandom 0.4.
    { crate = "getrandom@0.4", reason = "Windows-only build dependency of aws-lc-sys (cc, jobserver); rand 0.9 uses 0.3" },
    { crate = "r-efi@6", reason = "UEFI-only dependency of getrandom 0.4; getrandom 0.3 uses r-efi 5" },
    # aws-smithy-checksums (through aws-sdk-s3) uses crc-fast, whose default
    # `std` feature pulls in digest 0.10 and crypto-common 0.1, while the
    # SDK's own hmac, sha1, sha2, and md-5 are on digest 0.11. Remove once
    # crc-fast moves to digest 0.11.
    { crate = "digest@0.10", reason = "crc-fast (AWS SDK checksums) is still on digest 0.10" },
    { crate = "crypto-common@0.1", reason = "digest 0.10 through crc-fast (AWS SDK checksums)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
