[package]
name = "skys3-cluster"
description = "SkyS3 replicated node services: the gateway's shards over replication, following the shard registers that name a node, and starting the planned handoffs a coordinator asks for."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
skys3-control.workspace = true
skys3-coord.workspace = true
skys3-gateway.workspace = true
skys3-index.workspace = true
skys3-io.workspace = true
skys3-log.workspace = true
skys3-net.workspace = true
skys3-shard.workspace = true
skys3-types.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
rcgen.workspace = true
# `test-util` for the fault-injecting control store.
skys3-control = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "test-util", "time"] }
