[package]
name = "skys3"
description = "SkyS3 node: configuration, wiring, startup recovery, and admin commands."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
prometheus-client.workspace = true
rand.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
skys3-config.workspace = true
skys3-control.workspace = true
skys3-flush.workspace = true
skys3-gateway.workspace = true
skys3-index.workspace = true
skys3-io.workspace = true
skys3-log.workspace = true
skys3-net.workspace = true
skys3-obs.workspace = true
skys3-peer.workspace = true
skys3-remote.workspace = true
skys3-shard.workspace = true
skys3-sts.workspace = true
skys3-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# `test-util` lets the SDK matrix configure the default credential chain
# from an environment of its own.
aws-config = { workspace = true, features = ["test-util"] }
aws-credential-types.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-http-client.workspace = true
aws-types.workspace = true
md-5.workspace = true
# The coordinator's and repair's metrics, for the metrics reference tests.
skys3-coord.workspace = true
skys3-ec.workspace = true
# Enables `test-util` for the in-memory shards in unit tests.
skys3-gateway = { workspace = true, features = ["test-util"] }
skys3-sim.workspace = true
# Enables `test-util` for the token minting of the SDK matrix's issuer.
skys3-sts = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-rustls.workspace = true
# Parses the Prometheus alerting rules under deploy/ in the metrics tests.
yaml-rust2.workspace = true
